<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a6c6a"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon-192.png">
<title>Dashboard – Smart Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="dash">
  <header class="dhead">
    <div><a class="brand" href="/">Smart Booking</a><h1 id="bizName"></h1></div>
    <button class="btn ghost small" id="logout" type="button">Logout</button>
  </header>

  <div class="share">
    <span>Customer link:</span>
    <code id="link">...</code>
    <button class="btn small" id="copy" type="button">Copy</button>
    <a class="btn ghost small" id="wa" target="_blank" rel="noopener">Share on WhatsApp</a>
  </div>

  <div class="nav" role="tablist">
    <button role="tab" id="navB" aria-selected="true" type="button">Bookings</button>
    <button role="tab" id="navS" aria-selected="false" type="button">Business settings</button>
  </div>

  <section id="paneB">
    <div class="datebar">
      <button class="btn ghost small" id="prev" type="button" aria-label="Previous day">‹</button>
      <label class="sr" for="day">Date</label>
      <input type="date" id="day">
      <button class="btn ghost small" id="next" type="button" aria-label="Next day">›</button>
      <button class="btn small today" id="today" type="button">Today</button>
      <button class="btn small" id="addBtn" type="button">Add booking</button>
    </div>

    <form class="card hidden" id="addForm" novalidate>
      <h2>New booking (phone or walk-in)</h2>
      <div class="row">
        <div class="field"><label for="aSvc">Service</label><select id="aSvc"></select></div>
        <div class="field"><label for="aDate">Date</label><input type="date" id="aDate"></div>
        <div class="field"><label for="aTime">Time</label><select id="aTime"></select></div>
      </div>
      <div class="row">
        <div class="field"><label for="aName">Customer name</label><input id="aName" maxlength="80"></div>
        <div class="field"><label for="aPhone">Mobile number</label><input id="aPhone" type="tel" inputmode="numeric"></div>
      </div>
      <p class="err" id="aErr" role="alert"></p>
      <button class="btn" type="submit">Save booking</button>
    </form>

    <div class="sheet" id="sheet" aria-live="polite"></div>
  </section>

  <section id="paneS" class="hidden">
    <form id="setForm" novalidate>
      <div class="card">
        <h2>Business details</h2>
        <div class="field"><label for="sName">Business name</label><input id="sName" maxlength="80"></div>
        <div class="row">
          <div class="field"><label for="sCat">Category</label><input id="sCat" maxlength="60" placeholder="Salon, Clinic, Turf..."></div>
          <div class="field"><label for="sAddr">Address</label><input id="sAddr" maxlength="200"></div>
        </div>
        <div class="field"><label for="sDetails">More details <span class="hint">(offers, rules, parking, anything customers ask about)</span></label><textarea id="sDetails" maxlength="2000"></textarea></div>
        <div class="field"><label for="sInstr">How the assistant should talk <span class="hint">(optional)</span></label><textarea id="sInstr" maxlength="1500" placeholder="For example: Keep a friendly tone. Do not ask for advance payment."></textarea></div>
      </div>

      <div class="card">
        <h2>Timings</h2>
        <div class="row">
          <div class="field"><label for="sOpen">Opening time</label><input type="time" id="sOpen"></div>
          <div class="field"><label for="sClose">Closing time</label><input type="time" id="sClose"></div>
          <div class="field"><label for="sSlot">Slot length (minutes)</label>
            <select id="sSlot"><option>15</option><option>20</option><option>30</option><option>45</option><option>60</option></select></div>
        </div>
        <div class="row">
          <div class="field"><label for="sBS">Break starts <span class="hint">(optional)</span></label><input type="time" id="sBS"></div>
          <div class="field"><label for="sBE">Break ends</label><input type="time" id="sBE"></div>
        </div>
        <label>Closed days</label>
        <div class="days" id="days"></div>
      </div>

      <div class="card">
        <h2>Services</h2>
        <p class="hint">Each service needs a name, a price (₹) and how many minutes it takes.</p>
        <div id="svcList"></div>
        <button class="btn ghost small" id="addSvc" type="button">Add service</button>
      </div>

      <p class="err" id="sErr" role="alert"></p>
      <button class="btn" type="submit" id="sSave">Save changes</button>
    </form>
  </section>
</div>
<script type="module" src="/dashboard.js"></script>
</body>
</html>
