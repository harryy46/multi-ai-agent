<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a6c6a"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon-192.png">
<title>Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="chatpage">
  <header class="chathead">
    <h1 id="bizName">Loading...</h1>
    <p id="bizMeta"></p>
  </header>
  <div class="chips hidden" id="chips" aria-label="Services"></div>
  <div class="chatlog" id="log" role="log" aria-live="polite"><div class="msgs" id="msgs"></div></div>
  <form class="composer" id="form">
    <label class="sr" for="msg">Write your message</label>
    <input id="msg" maxlength="500" autocomplete="off" placeholder="Type here..." disabled>
    <button class="btn" id="send" type="submit" disabled>Send</button>
  </form>
</div>
<script type="module" src="/chat.js"></script>
</body>
</html>
